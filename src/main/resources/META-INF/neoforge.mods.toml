modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecolonies"
type="required"
versionRange="[0.0.11-26.1.2,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ae2"
type="required"
versionRange="[26.1.0-alpha,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="domum_ornamentum"
type="required"
versionRange="[1.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jade"
type="optional"
versionRange="[26.1.0,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="curios"
type="optional"
versionRange="[15.0.0,)"
ordering="AFTER"
side="BOTH"

# EMI recipe-viewer integration (hover show recipe/uses on the WH/ME panels;
# replaces the former JEI plugin). Optional + CLIENT: the mod boots fine without
# EMI; the plugin self-activates only if EMI is present.
[[dependencies.${mod_id}]]
modId="emi"
type="optional"
versionRange="[1.1.24,)"
ordering="AFTER"
side="CLIENT"