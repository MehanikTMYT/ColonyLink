# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1536m
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=26.1.2
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[26.1.2,26.2)
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=26.1.2.122
# The Neo version range can use any version of Neo as bounds
neo_version_range=[26.1.2.81,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[4,)

# Required -- resolved from mavenLocal(), published by our local 26.1.2 ports (see build.gradle
# comments; pattern and exact versions match the already-working ../mctradepost-retro build).
minecolonies_version=1.1.1397-26.1.2
structurize_version=0.0.1-26.1.2
multipiston_version=0.0.1-26.1.2
blockui_version=0.0.1-26.1.2
domumornamentum_version=1.0.0-local

# Native EMI integration, built locally to mavenLocal() from the port26.1 branch of
# https://github.com/MehanikTMYT/emi. Pinned to the same commit ../mctradepost-retro resolves to
# at runtime (domum-ornamentum transitively pulls this newer commit in ahead of whatever
# MineColonies' own gradle.properties requests).
emiVersion=1.1.24-semi151a6c88+26.1.2

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.

# ColonyLink-only dependencies (26.1.2)
ae2_version=26.1.11-SNAPSHOT
jade_version=26.1.8+neoforge
curios_version=15.0.0+26.1.2

mod_id=colonylink
mod_name=ColonyLink
mod_license=GPL-3.0-only
mod_version=1.6.9-26.1.2
mod_group_id=com.colonylink
mod_authors=Am0rPhe
mod_description=Connects MineColonies builders with Applied Energistics 2 autocrafting networks.
